name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, lint, web export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # No `cache: npm`: actions/cache is a known incompatibility under the
      # self-hosted act dispatcher (revvel-standards ops/self-hosted-ci), which
      # is how workflows run while GitHub-hosted runners are unavailable.
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: Install dependencies
        # --ignore-scripts: no dependency here needs lifecycle scripts (verified:
        # the full pipeline below passes without them).
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test:ci

      - name: Lint
        run: npm run lint:ci

      - name: Web export (the ship path)
        run: npm run export:web
        env:
          CI: "1"

      - name: Export sanity check
        # Static rendering must produce real page content, not an empty shell.
        # The phrase is feed-screen body copy from app/(tabs)/index.tsx — the
        # app name alone would match the <title> even with an empty body.
        run: |
          test -f dist/index.html
          grep -q "Compare claims against the evidence." dist/index.html
